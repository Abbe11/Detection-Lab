title: Reverse Shell or Crypto Miner from a Web Service
id: 8a3f1d6c-4b29-4e75-9c0d-abbe11labrule5
status: experimental
description: A web service process spawns a shell that connects out, or any process launches a known crypto miner. Classic post-exploitation after a web app compromise.
author: Abbe
date: 2026/09/28
logsource:
    category: process_creation
    product: linux
detection:
    web_parent:
        parent_process|contains:
            - nginx
            - apache
            - httpd
            - php-fpm
    shell_child:
        child_process|contains:
            - /bin/bash
            - /bin/sh
            - /dev/tcp
            - ncat
    miner:
        child_process|contains:
            - xmrig
    condition: (web_parent and shell_child) or miner
falsepositives:
    - Admin or deployment scripts that legitimately launch shells
level: critical
tags:
    - attack.execution
    - attack.t1059
    - attack.impact
    - attack.t1496
